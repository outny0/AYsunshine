<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AY션샤인">
<title>AY션샤인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f2f5;--card:#fff;--border:#e4e8ef;--line:#eef1f5;--soft:#f6f8fa;
  --text:#1a1a1a;--sub:#3d434c;--muted:#5c6370;
  --accent:#1a6fd4;--accent-dk:#0b4f9c;
  --hdr:#0d1117;--hdr2:#161b22;--hb:#30363d;--ht:#e6edf3;--hm:#9aa4b0;
  --jw-bg:#ddf4ff;--jw-fg:#0b4f9c;--ay-bg:#fff1dc;--ay-fg:#8a4b00;
  --bb-bg:#cfe3fb;--bb-fg:#0b3d75;--bb-bd:#9cc3f2;
  --e-bg:#fff1dc;--e-fg:#6b3a00;--e-bd:#e8b56d;
  --out-bg:#f0f2f5;--out-bd:#d0d7de;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:var(--hdr);color:var(--ht);padding:calc(16px + env(safe-area-inset-top)) 16px 14px;display:flex;flex-direction:column;gap:12px}
main{padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.flush{padding:0;gap:0;overflow:hidden}
.h2{font-size:15px;font-weight:700;margin:0}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px;white-space:nowrap}
.b-jw{background:var(--jw-bg);color:var(--jw-fg)}.b-ay{background:var(--ay-bg);color:var(--ay-fg)}
.res{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.res.W{background:var(--accent);color:#fff}.res.L{background:var(--border);color:var(--sub)}.res.D{background:var(--soft);color:var(--sub);border:1px solid var(--border)}

/* 헤더 */
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.title{font-size:18px;font-weight:700}
.back{width:44px;height:44px;margin-left:-10px;display:flex;align-items:center;justify-content:center;color:var(--ht);border:none;background:none}
.ltabs{display:grid;grid-template-columns:repeat(3,1fr)}
.ltab{height:44px;border:none;background:none;color:var(--hm);font-size:14px;border-bottom:3px solid transparent}
.ltab.on{color:#fff;font-weight:700;border-bottom-color:var(--accent)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:36px;padding:0 16px;border-radius:99px;border:1px solid var(--hb);background:transparent;color:#c9d1d9;font-size:13px;font-weight:500}
.pill.on{background:var(--ht);color:var(--hdr);border-color:var(--ht)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--hdr2);border:1px solid var(--hb)}
.seg button{height:38px;border:none;border-radius:9px;background:transparent;color:var(--hm);font-size:14px}
.seg button.on{background:var(--ht);color:var(--hdr);font-weight:700}
.seg.light{background:var(--border);border:none}
.seg.light button{color:var(--muted)}
.seg.light button.on{background:#fff;color:var(--text)}

/* 연도 선택 */
.ysel{position:relative;flex-shrink:0}
.ysel select{appearance:none;-webkit-appearance:none;height:38px;padding:0 32px 0 14px;border-radius:10px;border:1px solid var(--hb);background:var(--hdr2);color:var(--ht);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.ysel::after{content:'';position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:2px solid var(--hm);border-bottom:2px solid var(--hm);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.ysel select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.past-tag{font-size:11px;font-weight:700;color:#e3b341}
.yt{font-size:13px}
.yt th{background:var(--soft);color:var(--muted);font-size:11px;font-weight:500;padding:9px 6px;text-align:right;white-space:nowrap}
.yt td{padding:9px 6px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.yt th:first-child,.yt td:first-child{text-align:left;padding-left:14px}
.yt td:last-child,.yt th:last-child{padding-right:14px}
.yt tr.cur td{font-weight:700;color:var(--accent)}
.yt tr.tot td{font-weight:700;background:var(--soft)}
.yrow{display:grid;grid-template-columns:44px 1fr 84px;align-items:center;gap:10px;font-size:13px;color:var(--text);min-height:36px;border:none;background:none;padding:0;font-family:inherit;text-align:left;width:100%}
.yrow .trk{height:14px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.yrow .trk i{display:block;height:100%}
.yrow.cur{font-weight:700}
.yrow.cur span:first-child{color:var(--accent)}

/* 홈 */
.big{font-size:34px;font-weight:900;letter-spacing:-1px}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--soft);border-radius:10px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.stat b{font-size:17px}
.form{display:flex;gap:5px}
.form span{flex:1;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.form .W{background:var(--accent);color:#fff}.form .L{background:var(--border);color:var(--sub)}.form .D{background:var(--soft);color:var(--sub)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.vs .sc{font-size:36px;font-weight:900}
.note{font-size:12px;color:var(--sub);background:var(--soft);border-radius:10px;padding:10px 12px}
.btn{height:44px;border-radius:12px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;background:#fff;color:var(--accent)}
.leaders{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.leader{background:var(--soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:3px;color:var(--text)}
.leader b{font-size:22px;font-weight:900;color:var(--accent)}

/* 경기 목록 */
.month{display:flex;justify-content:space-between;align-items:baseline;padding:8px 4px 0}
.game{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:44px 1fr auto 30px;align-items:center;gap:10px;color:var(--text)}
.game .d{display:flex;flex-direction:column;align-items:center}
.game .d b{font-size:16px}
.game .opp{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game .score{font-size:18px;font-weight:900}
details.past{background:#fff;border:1px solid var(--border);border-radius:14px}
details.past summary{min-height:48px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:500;cursor:pointer;list-style:none}
details.past summary::-webkit-details-marker{display:none}
details.past[open] summary{border-bottom:1px solid var(--line)}
.plist{display:flex;flex-direction:column}
.plist div{display:grid;grid-template-columns:52px 1fr auto 26px;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.plist div:last-child{border-bottom:none}

/* 박스스코어 */
.score-hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 8px 0}
.score-hd .t{display:flex;flex-direction:column;align-items:center;gap:2px}
.score-hd .n{font-size:44px;font-weight:900}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.ls{font-size:13px;text-align:center}
.ls th,.ls td{padding:7px 3px}
.ls thead th{font-size:11px;color:var(--muted);font-weight:500}
.ls tbody tr{border-top:1px solid var(--line)}
.ls .tn{text-align:left;padding-left:4px;white-space:nowrap}
.ls .R{font-weight:900;border-left:1px solid var(--border)}
.bat{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px;color:var(--text)}
.bat .top{display:flex;align-items:baseline;gap:8px}
.bat .ord{width:16px;font-size:12px;color:var(--muted)}
.bat .nm{font-size:15px;font-weight:700}
.bat .ln{margin-left:auto;font-size:13px;color:var(--sub);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.bat .chips{padding-left:24px}
.chip{font-size:12px;padding:3px 8px;border-radius:7px;border:1px solid var(--out-bd);background:var(--out-bg);color:var(--sub)}
.chip.H{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.BB{background:var(--bb-bg);border-color:var(--bb-bd);color:var(--bb-fg)}
.chip.E{background:var(--e-bg);border-color:var(--e-bd);color:var(--e-fg)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);padding:0 4px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;border:1px solid}
.warn{background:#fff8e6;border:1px solid #f0d08a;border-radius:10px;padding:10px 12px;font-size:12px;color:#5a3d00}
.pit{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center}
.pit div{display:flex;flex-direction:column;gap:1px}
.pit b{font-size:15px}

/* 선수 기록 표 */
.sorts{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.sort{flex-shrink:0;height:34px;padding:0 13px;border-radius:99px;border:1px solid var(--out-bd);background:#fff;color:var(--sub);font-size:13px}
.sort.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.lchips{display:flex;gap:6px}
.st{font-size:13px}
.st th{background:var(--soft);color:var(--muted);font-size:11px;font-weight:500;padding:10px 4px;text-align:right;white-space:nowrap}
.st th:nth-child(-n+2){text-align:left}
.st th.on{color:var(--accent);font-weight:700}
.st td{padding:0 4px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.st td:first-child,.st th:first-child{padding-left:12px;text-align:left;color:var(--muted);font-size:12px}
.st td:nth-child(2){text-align:left}
.st td:nth-child(2) a{display:flex;align-items:center;min-height:44px;font-weight:500;color:var(--text)}
.st td.on{font-weight:700;color:var(--text)}
.st td:last-child,.st th:last-child{padding-right:12px}

/* 선수 상세 */
.pno{width:56px;height:56px;border-radius:16px;background:#21262d;border:1px solid var(--hb);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900}
.slash{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.slash b{font-size:20px;font-weight:900;display:block}
.cnt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bars{display:grid;gap:10px;align-items:end;height:150px}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bars i{width:100%;max-width:36px;border-radius:6px 6px 2px 2px;background:#c9d6e6}
.bars .cur i{background:var(--accent)}
.bars .cur b{color:var(--accent)}
.bars b{font-size:12px}
.blab{display:grid;gap:10px;text-align:center;border-top:1px solid var(--border);padding-top:6px;font-size:11px;color:var(--muted)}
.glog{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;color:var(--text)}

/* 하단 탭 */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding:6px 0 calc(8px + env(safe-area-inset-bottom));z-index:10}
nav.tabbar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabbar a{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px}
nav.tabbar a.on{color:var(--accent);font-weight:700}
.foot{font-size:11px;color:var(--muted);padding:0 4px}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="app" id="app"><div class="empty">불러오는 중…</div></div>
<nav class="tabbar" aria-label="하단 메뉴"><div class="in">
  <a href="#/" data-tab="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/></svg>홈</a>
  <a href="#/games" data-tab="games"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>경기</a>
  <a href="#/players" data-tab="players"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>선수</a>
</div></nav>

<script>
// AY션샤인 모바일 대시보드 — data.json(scrape_leagues.py 출력)을 읽어 해시 라우팅으로 5개 화면 렌더
const LG = { all: '통합', jw: '정왕', ay: '안양' };
const LG_NAME = { '정왕': 'jw', '안양': 'ay' };
let D = null;
const S = {                      // 화면 상태 (리그 선택은 기기에 기억)
  year: 0, league: load('lg', 'all'), gFilter: 'all',
  pTab: 'bat', pLeague: 'all', sortBat: 'avg', sortPit: 'era', boxTab: 'bat'
};
function load(k, d) { try { return localStorage.getItem('ay.' + k) || d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem('ay.' + k, v); } catch (e) {} }

const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const avg3 = v => (v ?? 0).toFixed(3).replace(/^0(?=\.)/, '');
const md = d => `${+d.slice(5, 7)}.${d.slice(8, 10)}`;
const result = g => g.result ? { '승': 'W', '패': 'L', '무': 'D' }[g.result]
  : g.scored > g.allowed ? 'W' : g.scored < g.allowed ? 'L' : 'D';
const RES_KO = { W: '승', L: '패', D: '무' };
const lgBadge = g => g.league === '정왕'
  ? `<span class="badge b-jw">정왕${g.div ? ' · ' + esc(g.div.replace('정왕', '')) : ''}</span>`
  : `<span class="badge b-ay">안양 · ${esc(g.comp)}${g.league_season && g.league_season !== g.date.slice(0, 4) ? ` (${esc(g.league_season.slice(2))}시즌)` : ''}</span>`;
const ICON_BACK = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';

// 타석 결과 분류 (scrape_leagues.pa_kind 와 같은 규칙)
function paKind(p) {
  const t = p.split(/[,/]/)[0].trim();
  if (t.includes('홈')) return 'H';
  if (t.includes('사구') || t.includes('4구') || t.includes('고4')) return 'BB';
  if (t === '스낫(출)' || t.includes('실')) return 'E';
  if (t.includes('삼진') || t.includes('스낫')) return 'O';
  if (/[23]$/.test(t) && /[좌중우유]/.test(t)) return 'H';
  if (t.includes('안')) return 'H';
  return 'O';
}
const chips = pas => `<div class="chips">${pas.map(p => `<span class="chip ${paKind(p)}">${esc(p.replace(/,/g, ' · '))}</span>`).join('')}</div>`;

// 시즌 데이터: 올해는 data.json, 지난 시즌은 seasons/YYYY.json 을 처음 볼 때 받아옴
const SEA = {};
const isCur = () => S.year === D.season;
const cur = () => SEA[S.year];
const games = lg => cur().box.filter(g => lg === 'all' || LG_NAME[g.league] === lg);
const stats = lg => cur().stats[lg];
function loadYear(y) {
  if (SEA[y]) return Promise.resolve(SEA[y]);
  return fetch(`seasons/${y}.json`).then(r => { if (!r.ok) throw new Error(`${y} 시즌 기록 없음 (${r.status})`); return r.json(); })
    .then(j => (SEA[y] = j));
}
function setYear(y) {
  y = +y;
  if (!D.years.includes(y)) return;
  loadYear(y).then(() => { S.year = y; render(); })
    .catch(err => alertBar(err.message));
}
function alertBar(msg) { const m = $app.querySelector('main'); if (m) m.insertAdjacentHTML('afterbegin', `<div class="warn">${esc(msg)}</div>`); }
const yearSel = () => `<label class="ysel"><span class="sr">시즌 선택</span>
  <select data-act="year">${D.years.map(y => `<option value="${y}"${y === S.year ? ' selected' : ''}>${y}</option>`).join('')}</select></label>`;
const seasonLabel = () => isCur() ? `${D.season} 시즌 · ${esc(D.updated.slice(5).replace('-', '.'))} 갱신`
  : `<span class="past-tag">지난 시즌</span> ${S.year}`;

// 규정: 타자 = 팀 경기수 × 2 타석, 투수 = 10이닝(30아웃)
const qualPA = lg => games(lg).length * 2;
const QUAL_OUTS = 30;

// ---------- 화면: 홈 ----------
function viewHome() {
  const lg = S.league, gs = games(lg);
  const w = gs.filter(g => result(g) === 'W').length, l = gs.filter(g => result(g) === 'L').length;
  const rs = gs.reduce((a, g) => a + g.scored, 0), ra = gs.reduce((a, g) => a + g.allowed, 0);
  const n = gs.length || 1, rd = rs - ra;
  const last = gs[gs.length - 1];
  const st = stats(lg);
  const q = qualPA(lg);
  const qb = st.batters.filter(b => b.pa >= q);
  const top = (arr, k) => arr.slice().sort((a, b) => b[k] - a[k])[0];
  const qp = st.pitchers.filter(p => p.outs >= QUAL_OUTS).sort((a, b) => a.era - b.era)[0];
  const lead = [
    ['타율', top(qb, 'avg'), b => avg3(b.avg)], ['타점', top(st.batters, 'rbi'), b => b.rbi],
    ['도루', top(st.batters, 'sb'), b => b.sb], ['평균자책점', qp, p => p.era.toFixed(2)]
  ].filter(x => x[1]);
  let hi = '';
  if (last) {
    const best = last.batters.slice().sort((a, b) => (b.h * 2 + b.rbi) - (a.h * 2 + a.rbi))[0];
    if (best) hi = `${esc(best.name)} ${best.ab}타수 ${best.h}안타 ${best.rbi}타점`;
    const inn = last.line.ay.inn.map(Number), mx = Math.max(...inn);
    if (mx >= 5) hi += ` · ${inn.indexOf(mx) + 1}회 ${mx}득점 빅이닝`;
  }
  return `
  <header>
    <div class="brand">
      <div class="logo">AY</div>
      <div style="flex:1;display:flex;flex-direction:column">
        <span class="title">AY션샤인</span>
        <span class="small" style="color:var(--hm)">${seasonLabel()}</span>
      </div>
      ${yearSel()}
    </div>
    <div class="ltabs" role="tablist" aria-label="리그 선택">

// 연도별 팀 성적 — 승(파랑)·무(연파랑)·패(회색) 막대, 누르면 그 시즌으로 이동

// ---------- 화면: 선수 기록 ----------
const BAT_COLS = [['g', '경기'], ['avg', '타율'], ['h', '안타'], ['hr', '홈런'], ['rbi', '타점'], ['sb', '도루'], ['ops', 'OPS']];
const BAT_SORT = [['avg', '타율'], ['ops', 'OPS'], ['h', '안타'], ['rbi', '타점'], ['sb', '도루'], ['hr', '홈런']];
const PIT_COLS = [['g', '경기'], ['era', 'ERA'], ['wl', '승-패'], ['ip', '이닝'], ['so', '삼진'], ['bb', '볼넷'], ['whip', 'WHIP']];
const PIT_SORT = [['era', 'ERA'], ['ip', '이닝'], ['so', '삼진'], ['w', '승'], ['g', '등판']];
function viewPlayers() {
  const lg = S.pLeague, st = stats(lg), isBat = S.pTab === 'bat';
  const key = isBat ? S.sortBat : S.sortPit;
  const q = qualPA(lg);
  let list;
  if (isBat) {
    list = st.batters.slice();
    // 비율 기록은 규정타석 이상 먼저
    const rate = key === 'avg' || key === 'ops';
    list.sort((a, b) => rate ? ((b.pa >= q) - (a.pa >= q)) || b[key] - a[key] : b[key] - a[key] || b.pa - a.pa);
  } else {
    list = st.pitchers.slice();
    list.sort((a, b) => key === 'era' ? ((b.outs >= QUAL_OUTS) - (a.outs >= QUAL_OUTS)) || a.era - b.era
      : key === 'ip' ? b.outs - a.outs : b[key] - a[key]);
  }
  const cols = isBat ? BAT_COLS : PIT_COLS;
  const cell = (k, p) => k === 'avg' ? avg3(p.avg) : k === 'ops' ? avg3(p.ops) : k === 'era' ? p.era.toFixed(2)
    : k === 'whip' ? p.whip.toFixed(2) : k === 'wl' ? `${p.w}-${p.l}` : k === 'ip' ? p.ip.toFixed(1) : p[k];
  const onCol = k => k === key || (k === 'ip' && key === 'ip');
  return `
  <header>
    <div class="row between"><div style="display:flex;flex-direction:column"><span class="title" style="font-size:20px">선수 기록</span>
      <span class="small" style="color:var(--hm)">${isCur() ? '' : '<span class="past-tag">지난 시즌</span> '}${S.year} · ${LG[lg]}</span></div>
      ${yearSel()}</div>
    <div class="seg" role="tablist" aria-label="타자 투수">
      <button role="tab" class="${isBat ? 'on' : ''}" data-act="ptab" data-v="bat">타자</button>
      <button role="tab" class="${isBat ? '' : 'on'}" data-act="ptab" data-v="pit">투수</button>
    </div>
    <div class="pills" role="tablist" aria-label="리그 필터">
      ${Object.keys(LG).map(k => `<button role="tab" class="pill${k === lg ? ' on' : ''}" data-act="pleague" data-v="${k}">${LG[k]}</button>`).join('')}
    </div>
  </header>
  <main style="gap:10px">
    <div class="sorts">${(isBat ? BAT_SORT : PIT_SORT).map(([k, l]) => `<button class="sort${k === key ? ' on' : ''}" data-act="sort" data-v="${k}">${l}</button>`).join('')}</div>
    <section class="card flush scroll" aria-label="기록 표">
      <table class="st"><thead><tr><th scope="col">#</th><th scope="col">이름</th>
        ${cols.map(([k, l]) => `<th scope="col" class="${onCol(k) ? 'on' : ''}">${l}</th>`).join('')}</tr></thead>
      <tbody>${list.map((p, i) => {
        const dim = isBat ? p.pa < q : p.outs < QUAL_OUTS;
        return `<tr style="${dim && (key === 'avg' || key === 'ops' || key === 'era') ? 'opacity:.55' : ''}"><td>${i + 1}</td>
          <td><a href="#/player/${encodeURIComponent(p.name)}">${esc(p.name)}</a></td>
          ${cols.map(([k]) => `<td class="${onCol(k) ? 'on' : ''}">${cell(k, p)}</td>`).join('')}</tr>`;
      }).join('')}</tbody></table>
    </section>
    <span class="foot">${isBat ? `비율 기록(타율·OPS)은 ${q}타석 이상 우선, 미달은 흐리게` : 'ERA는 10이닝 이상 우선, 미달은 흐리게 · ERA 7이닝 기준'}${lg !== 'jw' && !isBat ? ' · 안양 일부 경기는 자책·삼진 미입력' : ''}</span>
  </main>`;
}

// ---------- 화면: 선수 상세 ----------
// 통산 합계 (연도별 행을 더해 비율 재계산)
function careerBat(rows) {
  const t = rows.reduce((a, r) => { ['g', 'pa', 'ab', 'h', 'd2', 'd3', 'hr', 'rbi', 'r', 'sb', 'bb', 'hbp', 'so'].forEach(k => a[k] = (a[k] || 0) + r[k]); return a; }, {});
  const den = t.ab + t.bb + t.hbp, tb = t.h + t.d2 + 2 * t.d3 + 3 * t.hr;
  t.avg = t.ab ? t.h / t.ab : 0; t.obp = den ? (t.h + t.bb + t.hbp) / den : 0; t.slg = t.ab ? tb / t.ab : 0; t.ops = t.obp + t.slg;
  return t;
}
function careerPit(rows) {
  const t = rows.reduce((a, r) => { ['g', 'w', 'l', 's', 'outs', 'h', 'bb', 'hbp', 'so', 'r', 'er'].forEach(k => a[k] = (a[k] || 0) + r[k]); return a; }, {});
  const ip = t.outs / 3;
  t.era = ip ? t.er * 7 / ip : 0; t.whip = ip ? (t.h + t.bb + t.hbp) / ip : 0;
  return t;
}
// 연도별 막대그래프. lowGood: ERA처럼 낮을수록 좋은 값 → 최저값 막대 강조
function yearBars(rows, val, fmt, lowGood) {
  const max = Math.max(...rows.map(val), lowGood ? 1 : 0.5);
  const best = lowGood ? Math.min(...rows.map(val)) : Math.max(...rows.map(val));
  const cols = `grid-template-columns:repeat(${rows.length},1fr)`;
  return `<div class="bars" style="${cols}">${rows.map(x => `<div class="${x.year === S.year ? 'cur' : ''}"><b>${fmt(val(x))}</b>
      <i style="height:${Math.max(3, Math.round(val(x) / max * 110))}px${val(x) === best && x.year !== S.year ? ';background:#8fb3dd' : ''}"></i></div>`).join('')}</div>
    <div class="blab" style="${cols}">${rows.map(x => `<button data-act="year" data-v="${x.year}" style="border:none;background:none;font:inherit;color:inherit;padding:4px 0;min-height:32px">${x.year}</button>`).join('')}</div>`;
}
const ipStr = o => `${Math.floor(o / 3)}.${o % 3}`;

function viewPlayer(name) {
  const st = cur().stats.all, box = cur().box;
  const b = st.batters.find(x => x.name === name);
  const p = st.pitchers.find(x => x.name === name);
  const hb = (D.history?.batters || []).filter(x => x.name === name);
  const hp = (D.history?.pitchers || []).filter(x => x.name === name && x.outs > 0);
  const log = box.filter(g => g.batters.some(x => x.name === name) || g.pitchers.some(x => x.name === name)).slice().reverse();
  const allBox = Object.values(SEA).flatMap(x => x.box);
  const no = (allBox.flatMap(g => g.batters).find(x => x.name === name && x.no) || {}).no || '';
  const pos = (box.flatMap(g => g.batters).filter(x => x.name === name).map(x => x.pos).reduce((m, v) => (m[v] = (m[v] || 0) + 1, m), {}));
  const mainPos = Object.entries(pos).sort((a, c) => c[1] - a[1])[0]?.[0] || '';
  const yrs = [...new Set([...hb, ...hp].map(x => x.year))].sort();
  const cb = hb.length ? careerBat(hb) : null, cp = hp.length ? careerPit(hp) : null;
  return `
  <header style="padding-top:calc(8px + env(safe-area-inset-top))">
    <div class="row between"><a class="back" href="javascript:history.back()" aria-label="뒤로">${ICON_BACK}</a>${yearSel()}</div>
    <div class="row" style="gap:14px;padding-left:4px">
      <div class="pno">${esc(no) || '—'}</div>
      <div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:22px;font-weight:700">${esc(name)}</span>
        <span class="small" style="color:var(--hm)">${esc(mainPos)}${mainPos ? ' · ' : ''}${isCur() ? '' : '<span class="past-tag">지난 시즌</span> '}${S.year} ${log.length}경기${yrs.length > 1 ? ` · 통산 ${yrs.length}시즌 (${yrs[0]}~)` : ''}</span></div>
    </div>
  </header>
  <main>
    ${!b && !p ? `<div class="note">${S.year} 시즌 기록이 없습니다. 위 연도 선택이나 아래 연도별 기록에서 다른 시즌을 골라 보세요.</div>` : ''}
    ${b ? `<section class="card" aria-label="타격 기록">
      <div class="row between"><span class="h2">타격</span><span class="tiny muted">${S.year}</span></div>
      <div class="slash">
        <div><b style="color:var(--accent)">${avg3(b.avg)}</b><span class="tiny muted">타율</span></div>
        <div><b>${avg3(b.obp)}</b><span class="tiny muted">출루율</span></div>
        <div><b>${avg3(b.slg)}</b><span class="tiny muted">장타율</span></div>
        <div><b>${avg3(b.ops)}</b><span class="tiny muted">OPS</span></div>
      </div>
      <div class="cnt">${[['타석', b.pa], ['안타', b.h], ['2루타', b.d2], ['3루타', b.d3], ['홈런', b.hr], ['타점', b.rbi], ['득점', b.r], ['도루', b.sb]]
        .map(([k, v]) => `<div class="stat"><b style="font-size:15px">${v}</b><span class="tiny muted">${k}</span></div>`).join('')}</div>
    </section>` : ''}
    ${p ? `<section class="card" aria-label="투구 기록">
      <div class="row between"><span class="h2">투구</span><span class="tiny muted">${S.year}</span></div>
      <div class="cnt">${[['ERA', p.era.toFixed(2)], ['승-패', `${p.w}-${p.l}`], ['이닝', ipStr(p.outs)], ['삼진', p.so], ['피안타', p.h], ['4사구', p.bb + p.hbp], ['실점', p.r], ['WHIP', p.whip.toFixed(2)]]
        .map(([k, v]) => `<div class="stat"><b style="font-size:15px">${v}</b><span class="tiny muted">${k}</span></div>`).join('')}</div>
    </section>` : ''}
    ${hb.length > 1 ? `<section class="card" aria-label="연도별 타율">
      <div class="row between"><span class="h2">연도별 타율</span><span class="tiny muted">연도를 누르면 그 시즌</span></div>
      ${yearBars(hb, x => x.avg, avg3)}
    </section>` : ''}
    ${hp.length > 1 ? `<section class="card" aria-label="연도별 평균자책점">
      <div class="row between"><span class="h2">연도별 평균자책점</span><span class="tiny muted">낮을수록 좋음 · 7이닝 기준</span></div>
      ${yearBars(hp, x => x.era, v => v.toFixed(2), true)}
    </section>` : ''}
    ${hb.length ? `<section class="card flush scroll" aria-label="연도별 타격 기록">
      <span class="h2" style="padding:16px 16px 10px">연도별 타격</span>
      <table class="yt"><thead><tr><th scope="col">연도</th><th scope="col">경기</th><th scope="col">타석</th><th scope="col">타율</th><th scope="col">홈런</th><th scope="col">타점</th><th scope="col">도루</th><th scope="col">OPS</th></tr></thead>
      <tbody>${hb.slice().reverse().map(x => `<tr class="${x.year === S.year ? 'cur' : ''}"><td>${x.year}</td><td>${x.g}</td><td>${x.pa}</td><td>${avg3(x.avg)}</td><td>${x.hr}</td><td>${x.rbi}</td><td>${x.sb}</td><td>${avg3(x.ops)}</td></tr>`).join('')}
        ${hb.length > 1 ? `<tr class="tot"><td>통산</td><td>${cb.g}</td><td>${cb.pa}</td><td>${avg3(cb.avg)}</td><td>${cb.hr}</td><td>${cb.rbi}</td><td>${cb.sb}</td><td>${avg3(cb.ops)}</td></tr>` : ''}</tbody></table>
    </section>` : ''}
    ${hp.length ? `<section class="card flush scroll" aria-label="연도별 투구 기록">
      <span class="h2" style="padding:16px 16px 10px">연도별 투구</span>
      <table class="yt"><thead><tr><th scope="col">연도</th><th scope="col">경기</th><th scope="col">승-패</th><th scope="col">이닝</th><th scope="col">삼진</th><th scope="col">ERA</th><th scope="col">WHIP</th></tr></thead>
      <tbody>${hp.slice().reverse().map(x => `<tr class="${x.year === S.year ? 'cur' : ''}"><td>${x.year}</td><td>${x.g}</td><td>${x.w}-${x.l}</td><td>${ipStr(x.outs)}</td><td>${x.so}</td><td>${x.era.toFixed(2)}</td><td>${x.whip.toFixed(2)}</td></tr>`).join('')}
        ${hp.length > 1 ? `<tr class="tot"><td>통산</td><td>${cp.g}</td><td>${cp.w}-${cp.l}</td><td>${ipStr(cp.outs)}</td><td>${cp.so}</td><td>${cp.era.toFixed(2)}</td><td>${cp.whip.toFixed(2)}</td></tr>` : ''}</tbody></table>
    </section>
    <span class="foot">안양 리그는 투구 세부 기록(자책·삼진)이 빠진 경기가 있어 해당 연도 ERA가 실제보다 낮게 나올 수 있습니다.</span>` : ''}
    ${log.length ? `<section class="card flush" aria-label="경기별 기록">
      <span class="h2" style="padding:16px 16px 6px">${S.year} 경기별 기록</span>
      ${log.map(g => {
        const bt = g.batters.find(x => x.name === name), pt = g.pitchers.find(x => x.name === name);
        const ln = bt ? `${bt.ab}타수 ${bt.h}안타${bt.rbi ? ' ' + bt.rbi + '타점' : ''}` : '';
        const pl = pt ? `${ipStr(pt.outs)}이닝 ${pt.r}실점${pt.dec ? ' ' + esc(pt.dec) : ''}` : '';
        return `<a class="glog" href="#/game/${g.id}">
          <div class="row"><b style="font-size:13px">${md(g.date)}</b>${lgBadge(g)}<span class="small" style="color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">vs ${esc(g.opp)}</span>
            <span style="margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap">${[ln, pl].filter(Boolean).join(' · ')}</span></div>
          ${bt ? chips(bt.pas) : ''}</a>`;
      }).join('')}
    </section>` : ''}
  </main>`;
}

// ---------- 라우팅 ----------
function render() {
  if (!D) return;
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const [page, arg] = [h.split('/')[0], h.split('/').slice(1).join('/')];
  let html, tab;
  if (page === 'games') { html = viewGames(); tab = 'games'; }
  else if (page === 'game') {
    // 지난 시즌 경기 주소로 바로 들어온 경우: 아직 안 받은 시즌을 모두 받아서 다시 그림
    if (!Object.values(SEA).some(x => x.box.some(g => g.id === arg)) && D.years.some(y => !SEA[y])) {
      $app.innerHTML = '<div class="empty">불러오는 중…</div>';
      Promise.all(D.years.map(y => loadYear(y).catch(() => null))).then(render);
      return;
    }
    html = viewGame(arg); tab = 'games';
  }
  else if (page === 'players') { html = viewPlayers(); tab = 'players'; }
  else if (page === 'player') { html = viewPlayer(arg); tab = 'players'; }
  else { html = viewHome(); tab = 'home'; }
  $app.innerHTML = html;
  document.querySelectorAll('nav.tabbar a').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
}
// 화면 이동(해시 변경)은 맨 위로, 탭·정렬 같은 상태 변경은 해시가 그대로라 스크롤 유지
window.addEventListener('hashchange', () => { window.scrollTo(0, 0); S.boxTab = 'bat'; render(); });

$app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const v = t.dataset.v;
  if (t.dataset.act === 'year') { if (v) setYear(v); return; }   // 드롭다운(select)은 change 에서 처리
  switch (t.dataset.act) {
    case 'league': S.league = v; save('lg', v); break;
    case 'gfilter': S.gFilter = v; break;
    case 'boxtab': S.boxTab = v; break;
    case 'ptab': S.pTab = v; break;
    case 'pleague': S.pLeague = v; break;
    case 'sort': if (S.pTab === 'bat') S.sortBat = v; else S.sortPit = v; break;
  }
  render();
});

$app.addEventListener('change', e => { if (e.target.dataset.act === 'year') setYear(e.target.value); });

fetch('data.json?t=' + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(j => {
    if (!j.box || !j.stats) throw new Error('data.json 형식이 옛 버전입니다 (scrape_leagues.py 로 다시 생성 필요)');
    D = j; if (!LG[S.league]) S.league = 'all';
    D.years = D.years || [D.season];
    SEA[D.season] = { box: D.box, stats: D.stats };
    S.year = D.season;
    render();
  })
  .catch(err => { $app.innerHTML = `<div class="empty">데이터를 불러오지 못했습니다<br><span class="small">${esc(err.message)}</span></div>`; });
</script>
</body>
</html>
