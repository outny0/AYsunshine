<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚾ AY션샤인</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
:root{
  --blue:#1a6fd4;--blue-lt:#eef4ff;
  --green:#2e7d32;--green-lt:#e8f5e9;
  --orange:#e65100;--orange-lt:#fff3e0;
  --red:#c62828;--red-lt:#ffebee;
  --bg:#f2f4f8;--card:#fff;--border:#e8e8e8;
  --text:#1a1a1a;--sub:#666;--muted:#aaa;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh;}
.hdr{background:var(--card);padding:12px 16px 0;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.hrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.hrow h1{font-size:17px;font-weight:800;letter-spacing:-.3px;}
.hrow .upd{font-size:11px;color:var(--muted);}
.reload{font-size:20px;color:var(--muted);cursor:pointer;background:none;border:none;font-family:inherit;padding:2px 4px;line-height:1;}
.reload:active{color:var(--blue);}
.ltabs{display:flex;margin-top:2px;}
.ltab{flex:1;padding:9px 6px;text-align:center;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:2.5px solid transparent;font-family:inherit;transition:.12s;}
.ltab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:700;}
.sec{padding:14px 12px 0;}
.seclabel{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
.kpigrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.kpicard{background:var(--card);border-radius:14px;padding:13px 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.kpitit{font-size:11px;color:var(--sub);margin-bottom:4px;}
.kpival{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.1;}
.kpisub{font-size:11px;color:var(--muted);margin-top:3px;}
.kpicard.blue .kpival{color:var(--blue);}
.kpicard.grn .kpival{color:var(--green);}
.recent{background:var(--card);border-radius:14px;padding:11px 14px;margin-top:8px;box-shadow:0 1px 4px rgba(0,0,0,.05);display:flex;align-items:center;gap:8px;}
.rlab{font-size:11px;color:var(--sub);flex-shrink:0;}
.dots{display:flex;gap:5px;}
.dot{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.dot.w{background:var(--green-lt);color:var(--green);}
.dot.l{background:var(--red-lt);color:var(--red);}
.dot.d{background:#f5f5f5;color:#888;}
.chartrow{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
.chartcard{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.charttit{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:10px;}
#line-wrap{height:155px;position:relative;}
#radar-wrap{height:195px;position:relative;}
.top3grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.top3card{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.t3tit{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
.t3row{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
.t3rank{font-size:12px;font-weight:700;color:var(--muted);min-width:16px;}
.t3rank.g1{color:#f5a623;}.t3rank.g2{color:#9b9b9b;}.t3rank.g3{color:#c08a50;}
.t3name{font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.t3val{font-size:13px;font-weight:700;color:var(--blue);flex-shrink:0;}
.ftabs{background:var(--card);display:flex;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-top:14px;position:sticky;top:78px;z-index:15;}
.ftab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;font-family:inherit;transition:.1s;}
.ftab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:700;}
.sortbar{padding:8px 10px;display:flex;gap:6px;overflow-x:auto;background:var(--bg);scrollbar-width:none;}
.sortbar::-webkit-scrollbar{display:none;}
.sbtn{padding:5px 13px;border-radius:99px;border:1px solid #dde3ee;background:var(--card);font-size:12px;cursor:pointer;white-space:nowrap;color:#555;font-family:inherit;transition:.1s;}
.sbtn.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600;}
.qbtn{padding:5px 11px;border-radius:99px;border:1px solid #dde3ee;background:var(--card);font-size:12px;cursor:pointer;white-space:nowrap;color:var(--sub);font-family:inherit;margin-left:auto;flex-shrink:0;}
.qbtn.on{background:var(--green-lt);color:var(--green);border-color:#a5d6a7;}
.plist{padding:6px 10px 100px;}
.pcard{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:7px;display:flex;align-items:center;gap:11px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.05);transition:box-shadow .15s;}
.pcard:active{box-shadow:0 2px 10px rgba(0,0,0,.1);}
.prank{font-size:13px;font-weight:700;color:var(--muted);min-width:22px;text-align:center;flex-shrink:0;}
.prank.g1{color:#f5a623;}.prank.g2{color:#9b9b9b;}.prank.g3{color:#c08a50;}
.pmid{flex:1;min-width:0;}
.pname{font-size:15px;font-weight:700;}
.psub{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pbar{height:3px;background:#edf1fb;border-radius:2px;margin-top:8px;overflow:hidden;}
.pbfill{height:100%;border-radius:2px;background:var(--blue);transition:width .35s;}
.pbfill.grn{background:var(--green);}
.pright{text-align:right;flex-shrink:0;}
.pval{font-size:22px;font-weight:800;color:var(--blue);letter-spacing:-.5px;line-height:1.1;}
.pval.grn{color:var(--green);}
.plbl{font-size:10px;color:var(--muted);margin-top:2px;font-weight:600;letter-spacing:.04em;}
.sched-list{padding:6px 10px 100px;}
.schedbanner{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:7px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.sb-date{font-size:11px;color:var(--sub);margin-bottom:3px;}
.sb-opp{font-size:15px;font-weight:700;}
.sb-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.sb-res{font-size:15px;font-weight:800;}
.sb-res.w{color:var(--green);}.sb-res.l{color:var(--red);}.sb-res.d{color:var(--sub);}
.sb-score{font-size:18px;font-weight:800;margin-top:2px;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;}
.overlay.on{display:block;}
.modal{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-radius:22px 22px 0 0;max-height:82vh;overflow-y:auto;z-index:51;display:none;}
.modal.on{display:block;}
.minner{padding:0 18px 50px;}
.drag{width:38px;height:4px;background:#e0e0e0;border-radius:2px;margin:13px auto 14px;}
.mname{font-size:22px;font-weight:800;letter-spacing:-.3px;}
.msub{font-size:12px;color:var(--muted);margin-top:3px;}
.msec{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:16px 0 8px;}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.sg2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.si{background:#f5f7fc;border-radius:12px;padding:11px 6px;text-align:center;}
.si.hi{background:var(--blue-lt);}.si.warn{background:var(--orange-lt);}.si.grn{background:var(--green-lt);}
.siv{font-size:17px;font-weight:800;}
.si.hi .siv{color:var(--blue);}.si.warn .siv{color:var(--orange);}.si.grn .siv{color:var(--green);}
.sil{font-size:10px;color:var(--muted);margin-top:2px;font-weight:600;}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--muted);gap:14px;}
.spin{width:30px;height:30px;border:3px solid #e8e8e8;border-top-color:var(--blue);border-radius:50%;animation:rot .75s linear infinite;}
@keyframes rot{to{transform:rotate(360deg);}}
.ltxt{font-size:13px;}
.errbox{margin:24px 14px;background:#fff5f5;border-radius:13px;padding:22px 18px;text-align:center;color:var(--red);font-size:13px;line-height:1.7;}
.rbtn{margin-top:12px;padding:8px 20px;background:var(--blue);color:#fff;border:none;border-radius:9px;font-size:13px;cursor:pointer;font-family:inherit;}
.empty{background:var(--card);border-radius:14px;padding:18px 16px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.seclbl2{font-size:10px;font-weight:800;color:var(--sub);letter-spacing:.08em;text-transform:uppercase;padding:10px 4px 6px;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hrow">
    <h1>⚾ AY션샤인</h1>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="upd" id="upd">로딩 중...</span>
      <button class="reload" onclick="loadData()">↻</button>
    </div>
  </div>
  <div class="ltabs">
    <button class="ltab on" onclick="switchLeague('all')">통합</button>
    <button class="ltab" onclick="switchLeague('jw')">정왕</button>
    <button class="ltab" onclick="switchLeague('ay')">안양</button>
  </div>
</div>

<div class="sec">
  <div class="seclabel">팀 현황</div>
  <div class="kpigrid" id="kpi-grid"></div>
  <div id="recent-row"></div>
</div>

<div class="sec">
  <div class="seclabel">득점 / 실점 흐름</div>
  <div class="chartrow">
    <div class="chartcard">
      <div id="line-wrap"><canvas id="chart-line"></canvas></div>
    </div>
  </div>
</div>

<div class="sec">
  <div class="seclabel">부문 리더</div>
  <div class="top3grid" id="top3-grid"></div>
</div>

<div class="ftabs">
  <button class="ftab on" id="ft-bat" onclick="switchFooter('bat')">🏏 타자</button>
  <button class="ftab" id="ft-pit" onclick="switchFooter('pit')">⚡ 투수</button>
  <button class="ftab" id="ft-sch" onclick="switchFooter('sch')">📅 경기</button>
</div>

<div id="sec-bat">
  <div class="sortbar" id="bat-sb">
    <button class="sbtn on" onclick="sortB('AVG',this)">타율</button>
    <button class="sbtn" onclick="sortB('H',this)">안타</button>
    <button class="sbtn" onclick="sortB('RBI',this)">타점</button>
    <button class="sbtn" onclick="sortB('R',this)">득점</button>
    <button class="sbtn" onclick="sortB('SB',this)">도루</button>
    <button class="sbtn" onclick="sortB('PA',this)">타석</button>
    <button class="qbtn on" id="qbtn" onclick="toggleQual()">규정</button>
  </div>
  <div class="plist" id="bat-list"></div>
</div>

<div id="sec-pit" style="display:none">
  <div class="sortbar" id="pit-sb">
    <button class="sbtn on" onclick="sortP('ERA',this)">ERA</button>
    <button class="sbtn" onclick="sortP('WHIP',this)">WHIP</button>
    <button class="sbtn" onclick="sortP('K_BB',this)">K/BB</button>
    <button class="sbtn" onclick="sortP('IP',this)">이닝</button>
    <button class="sbtn" onclick="sortP('K',this)">탈삼진</button>
  </div>
  <div class="plist" id="pit-list"></div>
</div>

<div id="sec-sch" style="display:none">
  <div class="sched-list" id="sch-list"></div>
</div>

<div class="overlay" id="ov" onclick="closeModal()"></div>
<div class="modal" id="modal"><div class="minner" id="mbody"></div></div>

<script>
// ── State ──
let curLeague='all', qualOnly=true, bKey='AVG', pKey='ERA';
let sortedB=[], sortedP=[], chartLine=null;
let data={all:{batters:[],pitchers:[],games:[]},jw:{batters:[],pitchers:[],games:[]},ay:{batters:[],pitchers:[],games:[]}};

// ── Helpers ──
const fi = v => { const f=parseFloat(v); return isNaN(f)?'-':String(Math.round(f)); };
const fd = (v,d=3) => { const f=parseFloat(v); return isNaN(f)?'-':f.toFixed(d); };

function ipToDec(ip) {
  const full=Math.floor(parseFloat(ip)||0);
  const frac=Math.round(((parseFloat(ip)||0)-full)*10);
  return full + frac/3;
}

// ── Transform JSON → render format ──
function txBatter(b) {
  return { name:b.name, PA:b.pa, AB:b.ab, H:b.h, RBI:b.rbi, R:b.r, SB:b.sb, AVG:b.avg };
}
function txPitcher(p) {
  const ipDec = ipToDec(p.ip);
  const whip = ipDec>0 ? Math.round((p.h+p.bb)/ipDec*100)/100 : null;
  const kbb  = p.bb>0  ? Math.round(p.so/p.bb*100)/100 : null;
  return { name:p.name, G:p.g, IP:p.ip, ERA:p.era, WHIP:whip, K_BB:kbb,
           K:p.so, BB:p.bb, H:p.h, R:p.r, ER:p.er, W:p.w, L:p.l, SV:p.s };
}
function buildData(json) {
  const games    = json.games    || [];
  const batters  = (json.batters      || []).map(txBatter);
  const pitchers = (json.pitchers     || []).map(txPitcher);
  const jwBat    = (json.jw_batters   || []).map(txBatter);
  const jwPit    = (json.jw_pitchers  || []).map(txPitcher);
  const ayBat    = (json.ay_batters   || []).map(txBatter);
  const ayPit    = (json.ay_pitchers  || []).map(txPitcher);
  return {
    all: { batters,                   pitchers,                games },
    jw:  { batters: jwBat.length ? jwBat : batters, pitchers: jwPit.length ? jwPit : pitchers, games: games.filter(g=>g.league==='정왕') },
    ay:  { batters: ayBat.length ? ayBat : batters, pitchers: ayPit.length ? ayPit : pitchers, games: games.filter(g=>g.league==='안양') },
  };
}

// ── KPI ──
function renderOverview(batters, pitchers, games) {
  const gW=games.filter(g=>g.result==='승').length;
  const gL=games.filter(g=>g.result==='패').length;
  const gD=games.filter(g=>g.result==='무').length;
  const totG=gW+gL+gD;
  const winPct = totG>0 ? (gW/totG).toFixed(3) : '-';
  const totAB = batters.reduce((s,b)=>s+b.AB,0);
  const totH  = batters.reduce((s,b)=>s+b.H,0);
  const teamAVG = totAB>0 ? (totH/totAB).toFixed(3) : '-';
  const vp = pitchers.filter(p=>p.IP>0);
  const totIpDec = vp.reduce((s,p)=>s+ipToDec(p.IP),0);
  const totER    = vp.reduce((s,p)=>s+(p.ER||0),0);
  const teamERA  = totIpDec>0 ? (totER*7/totIpDec).toFixed(2) : '-';
  const totSB = batters.reduce((s,b)=>s+(b.SB||0),0);
  const totK  = pitchers.reduce((s,p)=>s+(p.K||0),0);

  document.getElementById('kpi-grid').innerHTML=`
    <div class="kpicard blue">
      <div class="kpitit">팀 전적</div>
      <div class="kpival">${totG>0?`${gW}승 ${gD}무 ${gL}패`:'기록 없음'}</div>
      <div class="kpisub">승률 ${winPct}</div>
    </div>
    <div class="kpicard grn">
      <div class="kpitit">팀 타율 / ERA</div>
      <div class="kpival">${teamAVG}</div>
      <div class="kpisub">ERA ${teamERA} (7이닝 기준)</div>
    </div>
    <div class="kpicard">
      <div class="kpitit">팀 도루</div>
      <div class="kpival">${totSB}</div>
      <div class="kpisub">타자 ${batters.length}명</div>
    </div>
    <div class="kpicard">
      <div class="kpitit">팀 탈삼진</div>
      <div class="kpival">${totK}</div>
      <div class="kpisub">투수 ${pitchers.length}명</div>
    </div>`;

  const recent = games.slice(-5).reverse();
  const recEl = document.getElementById('recent-row');
  if (recent.length>0) {
    const dots = recent.map(g=>{
      const cls=g.result==='승'?'w':g.result==='패'?'l':'d';
      return `<div class="dot ${cls}" title="${g.opp} ${g.scored}-${g.allowed}">${cls==='w'?'승':cls==='l'?'패':'무'}</div>`;
    }).join('');
    recEl.innerHTML=`<div class="recent"><span class="rlab">최근</span><div class="dots">${dots}</div></div>`;
  } else recEl.innerHTML='';
}

// ── 득점/실점 차트 ──
function renderCharts(games) {
  if (chartLine) { chartLine.destroy(); chartLine=null; }
  const wrap = document.getElementById('line-wrap');
  if (games.length===0) {
    wrap.innerHTML=`<div class="empty" style="margin:0"><strong>경기 기록 없음</strong></div>`; return;
  }
  wrap.innerHTML='<canvas id="chart-line" height="155"></canvas>';
  chartLine = new Chart(document.getElementById('chart-line'),{
    type:'line',
    data:{
      labels: games.map(g=>g.opp||g.date),
      datasets:[
        {label:'득점',data:games.map(g=>g.scored??0),borderColor:'#1a6fd4',backgroundColor:'rgba(26,111,212,.1)',tension:.3,fill:true,pointRadius:4},
        {label:'실점',data:games.map(g=>g.allowed??0),borderColor:'#e53935',backgroundColor:'rgba(229,57,53,.07)',tension:.3,fill:true,pointRadius:4},
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:12}}},
      scales:{x:{ticks:{font:{size:10},maxRotation:30},grid:{display:false}},y:{ticks:{font:{size:10},stepSize:1},beginAtZero:true}}}
  });
}

// ── 부문 리더 ──
function renderTop3(batters, pitchers) {
  const cats=[
    {key:'AVG',  label:'타율',  fmt:v=>v.toFixed(3), pool:batters,  asc:false},
    {key:'RBI',  label:'타점',  fmt:v=>Math.round(v),pool:batters,  asc:false},
    {key:'H',    label:'안타',  fmt:v=>Math.round(v),pool:batters,  asc:false},
    {key:'SB',   label:'도루',  fmt:v=>Math.round(v),pool:batters,  asc:false},
    {key:'ERA',  label:'ERA',   fmt:v=>v.toFixed(2), pool:pitchers, asc:true},
    {key:'K',    label:'탈삼진',fmt:v=>Math.round(v),pool:pitchers, asc:false},
    {key:'IP',   label:'이닝',  fmt:v=>v,            pool:pitchers, asc:false},
    {key:'WHIP', label:'WHIP',  fmt:v=>v.toFixed(2), pool:pitchers, asc:true},
  ];
  document.getElementById('top3-grid').innerHTML=cats.map(({key,label,fmt,pool,asc})=>{
    const sorted=[...pool].filter(p=>p[key]!=null).sort((a,b)=>asc?a[key]-b[key]:b[key]-a[key]).slice(0,3);
    const rows=sorted.map((p,i)=>{
      const cls=i===0?'g1':i===1?'g2':'g3';
      return `<div class="t3row"><div class="t3rank ${cls}">${i+1}</div><div class="t3name">${p.name}</div><div class="t3val">${fmt(p[key])}</div></div>`;
    }).join('');
    return `<div class="top3card"><div class="t3tit">${label}</div>${rows||'<div style="font-size:11px;color:#bbb;text-align:center;padding:8px 0">-</div>'}</div>`;
  }).join('');
}

// ── 타자 리스트 ──
function filteredBatters(batters) {
  if (!qualOnly) return batters;
  const maxPA = batters.reduce((m,b)=>Math.max(m,b.PA||0),0);
  const thr = Math.max(3, Math.round(maxPA*.25));
  return batters.filter(b=>(b.PA||0)>=thr);
}

function renderBatList(batters) {
  const pool=filteredBatters(batters);
  const isInt=['H','RBI','R','SB','PA'].includes(bKey);
  sortedB=[...pool].sort((a,b)=>(parseFloat(b[bKey])||0)-(parseFloat(a[bKey])||0));
  const max=parseFloat(sortedB[0]?.[bKey])||1;
  const lbls={AVG:'타율',H:'안타',RBI:'타점',R:'득점',SB:'도루',PA:'타석'};
  document.getElementById('bat-list').innerHTML=sortedB.map((p,i)=>{
    const raw=parseFloat(p[bKey])||0;
    const disp=isInt?Math.round(raw):raw.toFixed(3);
    const pct=Math.round(raw/max*100);
    const rc=i===0?'g1':i===1?'g2':i===2?'g3':'';
    const sub=`${fi(p.PA)}타석 ${fi(p.AB)}타수 ${fi(p.H)}안타 · 타점${fi(p.RBI)} 득점${fi(p.R)} 도루${fi(p.SB)}`;
    return `<div class="pcard" onclick="showB(${i})">
      <div class="prank ${rc}">${i+1}</div>
      <div class="pmid">
        <div class="pname">${p.name}</div>
        <div class="psub">${sub}</div>
        <div class="pbar"><div class="pbfill" style="width:${pct}%"></div></div>
      </div>
      <div class="pright"><div class="pval">${disp}</div><div class="plbl">${lbls[bKey]}</div></div>
    </div>`;
  }).join('')||'<div class="empty" style="margin:10px"><strong>타자 데이터 없음</strong></div>';
}

// ── 투수 리스트 ──
function renderPitList(pitchers) {
  const lb=['ERA','WHIP'].includes(pKey);
  sortedP=[...pitchers].sort((a,b)=>{
    const av=parseFloat(a[pKey])??(lb?9999:-1);
    const bv=parseFloat(b[pKey])??(lb?9999:-1);
    return lb?av-bv:bv-av;
  });
  const vals=sortedP.map(p=>parseFloat(p[pKey])).filter(v=>!isNaN(v)&&v>0);
  const maxV=Math.max(...vals,1), minV=Math.min(...vals,0);
  const lbls={ERA:'ERA',WHIP:'WHIP',K_BB:'K/BB',IP:'이닝',K:'탈삼진'};
  document.getElementById('pit-list').innerHTML=sortedP.map((p,i)=>{
    const raw=parseFloat(p[pKey]);
    const disp=isNaN(raw)?'-':pKey==='IP'?raw:raw.toFixed(2);
    const pct=isNaN(raw)?5:lb?Math.max(5,Math.round((maxV-raw)/Math.max(maxV-minV,.01)*100)):Math.round(raw/maxV*100);
    const rc=i===0?'g1':i===1?'g2':i===2?'g3':'';
    const good=lb&&i<3;
    const wl=`${fi(p.W)}승 ${fi(p.L)}패${(p.SV||0)>0?' '+fi(p.SV)+'세':''}`;
    const sub=`${fi(p.G)}등판 · ${p.IP}이닝 · ${fi(p.K)}K · ${wl}`;
    return `<div class="pcard" onclick="showP(${i})">
      <div class="prank ${rc}">${i+1}</div>
      <div class="pmid">
        <div class="pname">${p.name}</div>
        <div class="psub">${sub}</div>
        <div class="pbar"><div class="pbfill${good?' grn':''}" style="width:${pct}%"></div></div>
      </div>
      <div class="pright"><div class="pval${good?' grn':''}">${disp}</div><div class="plbl">${lbls[pKey]}</div></div>
    </div>`;
  }).join('')||'<div class="empty" style="margin:10px"><strong>투수 데이터 없음</strong></div>';
}

// ── 경기 기록 ──
function renderSchedule(games) {
  const past=[...games].sort((a,b)=>b.date.localeCompare(a.date));
  if (past.length===0) {
    document.getElementById('sch-list').innerHTML='<div class="empty" style="margin:10px"><strong>경기 기록 없음</strong></div>'; return;
  }
  document.getElementById('sch-list').innerHTML=
    `<div class="seclbl2">경기 결과</div>`+
    past.map(g=>{
      const cls=g.result==='승'?'w':g.result==='패'?'l':'d';
      return `<div class="schedbanner" style="display:flex;align-items:center;gap:12px">
        <div style="flex:1">
          <div class="sb-date">${g.date}${g.league?' · '+g.league:''}</div>
          <div class="sb-opp">vs ${g.opp}</div>
        </div>
        <div style="text-align:right">
          <div class="sb-res ${cls}">${g.result}</div>
          <div class="sb-score">${g.scored} - ${g.allowed}</div>
        </div>
      </div>`;
    }).join('');
}

function renderAll() {
  const d=data[curLeague];
  renderOverview(d.batters, d.pitchers, d.games);
  renderCharts(d.games);
  renderTop3(d.batters, d.pitchers);
  renderBatList(d.batters);
  renderPitList(d.pitchers);
  renderSchedule(d.games);
}

// ── UI 핸들러 ──
function switchLeague(l) {
  curLeague=l;
  document.querySelectorAll('.ltab').forEach((b,i)=>b.classList.toggle('on',['all','jw','ay'][i]===l));
  renderAll();
}
function switchFooter(t) {
  ['bat','pit','sch'].forEach(id=>{
    document.getElementById(`ft-${id}`).classList.toggle('on',id===t);
    document.getElementById(`sec-${id}`).style.display=id===t?'':'none';
  });
}
function sortB(key,btn) {
  bKey=key;
  document.querySelectorAll('#bat-sb .sbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderBatList(data[curLeague].batters);
}
function sortP(key,btn) {
  pKey=key;
  document.querySelectorAll('#pit-sb .sbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderPitList(data[curLeague].pitchers);
}
function toggleQual() {
  qualOnly=!qualOnly;
  const btn=document.getElementById('qbtn');
  btn.classList.toggle('on',qualOnly);
  btn.textContent=qualOnly?'규정':'전체';
  renderBatList(data[curLeague].batters);
}

// ── 모달 ──
function showB(i) {
  const p=sortedB[i]; if (!p) return;
  document.getElementById('mbody').innerHTML=`
    <div class="drag"></div>
    <div class="mname">${p.name}</div>
    <div class="msub">${fi(p.PA)}타석 · ${fi(p.AB)}타수 ${fi(p.H)}안타</div>
    <div class="msec">타격 기록</div>
    <div class="sg">
      <div class="si hi"><div class="siv">${fd(p.AVG)}</div><div class="sil">타율</div></div>
      <div class="si hi"><div class="siv">${fi(p.RBI)}</div><div class="sil">타점</div></div>
      <div class="si hi"><div class="siv">${fi(p.R)}</div><div class="sil">득점</div></div>
    </div>
    <div class="sg" style="margin-top:8px">
      <div class="si"><div class="siv">${fi(p.H)}</div><div class="sil">안타</div></div>
      <div class="si"><div class="siv">${fi(p.SB)}</div><div class="sil">도루</div></div>
      <div class="si"><div class="siv">${fi(p.PA)}</div><div class="sil">타석</div></div>
    </div>`;
  openM();
}
function showP(i) {
  const p=sortedP[i]; if (!p) return;
  const wl=`${fi(p.W)}승 ${fi(p.L)}패${(p.SV||0)>0?' '+fi(p.SV)+'세':''}`;
  document.getElementById('mbody').innerHTML=`
    <div class="drag"></div>
    <div class="mname">${p.name}</div>
    <div class="msub">${fi(p.G)}등판 · ${p.IP}이닝 · ${wl}</div>
    <div class="msec">핵심 지표</div>
    <div class="sg">
      <div class="si warn"><div class="siv">${fd(p.ERA,2)}</div><div class="sil">ERA</div></div>
      <div class="si hi"><div class="siv">${fd(p.WHIP,2)}</div><div class="sil">WHIP</div></div>
      <div class="si hi"><div class="siv">${p.K_BB!=null?fd(p.K_BB,2):'-'}</div><div class="sil">K/BB</div></div>
    </div>
    <div class="msec">투구 기록</div>
    <div class="sg">
      <div class="si"><div class="siv">${fi(p.K)}</div><div class="sil">탈삼진</div></div>
      <div class="si"><div class="siv">${fi(p.BB)}</div><div class="sil">볼넷</div></div>
      <div class="si"><div class="siv">${fi(p.H)}</div><div class="sil">피안타</div></div>
      <div class="si"><div class="siv">${fi(p.R)}</div><div class="sil">실점</div></div>
      <div class="si grn"><div class="siv">${fi(p.ER)}</div><div class="sil">자책점</div></div>
      <div class="si"><div class="siv">${p.IP}</div><div class="sil">이닝</div></div>
    </div>`;
  openM();
}
function openM(){document.getElementById('ov').classList.add('on');document.getElementById('modal').classList.add('on');}
function closeModal(){document.getElementById('ov').classList.remove('on');document.getElementById('modal').classList.remove('on');}

// ── 데이터 로드 ──
async function loadData() {
  document.getElementById('bat-list').innerHTML='<div class="loading"><div class="spin"></div><div class="ltxt">데이터 로딩 중...</div></div>';
  document.getElementById('kpi-grid').innerHTML='';
  document.getElementById('upd').textContent='로딩 중...';
  try {
    const r = await fetch('data.json');
    if (!r.ok) throw new Error(`data.json 로딩 실패 (${r.status})`);
    const json = await r.json();
    data = buildData(json);
    const d = data.all;
    document.getElementById('upd').textContent=
      `${(json.updated||'').slice(5,16)} · 타자 ${d.batters.length}명 · 투수 ${d.pitchers.length}명`;
    renderAll();
  } catch(e) {
    document.getElementById('bat-list').innerHTML=
      `<div class="errbox">⚠️ ${e.message}<br><button class="rbtn" onclick="loadData()">다시 시도</button></div>`;
    document.getElementById('upd').textContent='로드 실패';
  }
}
loadData();
</script>
